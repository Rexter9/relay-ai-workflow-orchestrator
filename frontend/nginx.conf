# Serves the built React app and makes client-side routing (react-router-dom)
# work on page refresh — any unknown path falls back to index.html so React
# Router can take over, instead of nginx returning a 404.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html itself is never
    # cached so a new deployment is always picked up on refresh.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}